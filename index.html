<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAC-MAN</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">PAC-MAN</div>
      <div class="scores">
        <div class="score-block">
          <span class="label">1UP</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-block">
          <span class="label">HIGH SCORE</span>
          <span class="value" id="highscore">0</span>
        </div>
        <div class="score-block">
          <span class="label">LIVES</span>
          <span class="value" id="lives">&#9679;&#9679;&#9679;</span>
        </div>
      </div>
    </header>

    <div id="game-wrapper">
      <canvas id="gameCanvas"></canvas>

      <div id="overlay" class="overlay visible">
        <div class="overlay-inner">
          <div class="ghost-parade">
            <span style="color:#FF0000">&#9670;</span>
            <span style="color:#FFB8FF">&#9670;</span>
            <span style="color:#00FFFF">&#9670;</span>
            <span style="color:#FFB852">&#9670;</span>
            <img src="assets/banner.png" alt="Pac-Man" style="width: 80%; max-width: 300px;"/>
          </div>
          <h1>PAC-MAN</h1>
          <p class="tagline">EAT DOTS · DODGE GHOSTS · SURVIVE</p>
          <div class="key-hint">
            <p>Arrow Keys or WASD to move</p>
            <p>Space to pause</p>
          </div>
          <button id="startBtn" class="btn-start">INSERT COIN</button>
        </div>
      </div>

      <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-inner">
          <h2>PAUSED</h2>
          <button id="resumeBtn" class="btn-start">RESUME</button>
        </div>
      </div>

      <div id="gameover-overlay" class="overlay hidden">
        <div class="overlay-inner">
          <h2 id="end-title">GAME OVER</h2>
          <p id="end-score"></p>
          <button id="restartBtn" class="btn-start">PLAY AGAIN</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/maze.js"></script>
  <script src="js/pacman.js"></script>
  <script src="js/ghost.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
